<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Ring</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Focus Ring</h1>
      <p class="subtitle" id="modeLabel">Focus session</p>
    </header>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 300 300">
        <circle class="ring-track" cx="150" cy="150" r="135" />
        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="135" />
      </svg>
      <div class="ring-center">
        <span class="time" id="timeDisplay">25:00</span>
        <span class="sessions-today" id="sessionsToday">0 sessions today</span>
      </div>
    </div>

    <div class="controls">
      <button id="startPauseBtn" class="primary">Start</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="skipBtn" class="secondary">Skip</button>
    </div>

    <div class="settings">
      <label>
        Focus
        <input type="number" id="focusMinutes" min="1" max="120" value="25" />
      </label>
      <label>
        Break
        <input type="number" id="breakMinutes" min="1" max="60" value="5" />
      </label>
      <label class="checkbox">
        <input type="checkbox" id="autoStart" />
        Auto-start next
      </label>
    </div>

    <div class="history">
      <div class="history-header">
        <h2>History</h2>
        <button id="clearHistoryBtn" class="link">Clear</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
